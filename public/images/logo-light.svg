<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 130" width="580" height="130">
  <defs>
    <style>
      .txt { font-family: 'Arial Black', 'Helvetica Neue', sans-serif; font-weight: 900; font-size: 80px; }
    </style>
  </defs>

  <!-- czarne tło -->
  <rect width="580" height="130" fill="transparent"/>

  <!-- ikona wiata - scale zwiększony z 0.88 do 1.35, wyśrodkowana pionowo -->
  <g transform="translate(2, 3) scale(1.35)">
    <polygon points="10,60 50,48 90,60 90,82 50,70 10,82" fill="#C45208"/>
    <polygon points="10,60 50,48 50,28 10,40" fill="#F5882A"/>
    <polygon points="50,48 90,60 90,40 50,28" fill="#E8650A"/>
    <polygon points="10,40 50,28 90,40 50,52" fill="#FBAB5A"/>
  </g>

  <!-- cień -->
  <text x="135" y="102" class="txt" opacity="0.4" dx="3" dy="3">
    <tspan fill="#000000">Konfig</tspan><tspan fill="#000000">li</tspan>
  </text>

  <!-- tekst główny -->
  <text x="135" y="102" class="txt">
    <tspan fill="#fffff">Konfig</tspan><tspan fill="#E8650A">li</tspan>
  </text>

</svg>
